name: fcg-orchestration

# ------------------------------------------------------------------
# FIAP Cloud Games - Full local system
# PostgreSQL (two logical databases) + single-broker Apache Kafka
# (KRaft, no Zookeeper) + topic init, plus the four microservices (Phase 2),
# the Kong API Gateway (Phase 3, DB-less, ./gateway/kong.yml),
# Redis (Phase 3, distributed cache for the CatalogAPI read model),
# MongoDB (Phase 3, NoSQL payment history for PaymentsAPI),
# Prometheus + Grafana (Phase 3, metrics; ./observability),
# Loki + Grafana Alloy (Phase 3, centralized container logs) and the
# Notifications Function container (Phase 3, main notification path).
# `docker compose up -d --build` runs the complete system.
#
# Host ports are parameterized (*_HOST_PORT / KONG_*_PORT in .env.example) so a
# port already in use on your machine can be remapped without touching the
# container ports or the in-network DNS names.
#
# The service repos must be cloned as SIBLINGS of this repo:
#   ../fiap-cloud-games-users-api
#   ../fiap-cloud-games-catalog-api
#   ../fiap-cloud-games-payments-api
#   ../fiap-cloud-games-notifications-function
#   ../fiap-cloud-games-notifications-api     (Phase 2 history; profile phase2-legacy only)
# ------------------------------------------------------------------

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fcg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fcg}
      POSTGRES_DB: ${POSTGRES_DB:-fcg}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fcg} -d ${POSTGRES_DB:-fcg}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      # Host access for services running on the host during development. The advertised
      # host listener below must use the same port, so KAFKA_HOST_PORT drives both.
      - "${KAFKA_HOST_PORT:-29092}:29092"
    environment:
      # --- KRaft single-node (combined broker + controller) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # --- Listeners ---
      # PLAINTEXT      -> internal docker-network clients (advertised as kafka:9092)
      # PLAINTEXT_HOST -> host machine clients            (advertised as localhost:29092)
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # --- Single-broker safe defaults ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      # Valid KRaft cluster id (base64 of a 16-byte UUID).
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # One-shot job: waits for Kafka to be healthy, creates the three FCG
  # topics idempotently, prints the topic list, then exits (0).
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Creating FCG topics..."
        for topic in fcg.users.created fcg.orders.placed fcg.payments.processed; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done
        echo "Current topics:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  # Redis 7 (Phase 3): distributed cache for the CatalogAPI read model
  # (cache-aside, short TTLs). No auth and no persistence: it is a cache only,
  # everything is rebuilt from PostgreSQL. Local-only settings.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # MongoDB 7 (Phase 3): NoSQL persistence for PaymentsAPI
  # (database fcg_payments, collection payments, one document per order).
  # Root credentials are LOCAL/DEV placeholders (see .env.example).
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-fcg}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-fcg}
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ------------------------------------------------------------------
  # .NET microservices (Phase 2). Images build from the sibling repositories.
  # In-network names: kafka:9092, postgres:5432. No container healthchecks
  # (aspnet runtime image has no curl); startup order via depends_on.
  # ------------------------------------------------------------------

  users-api:
    build:
      context: ../fiap-cloud-games-users-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=fcg_users;Username=${POSTGRES_USER:-fcg};Password=${POSTGRES_PASSWORD:-fcg}"
      Jwt__SecretKey: ${JWT__SECRETKEY:-dev-only-change-me-please-min-32-characters-placeholder}
      Jwt__Issuer: ${JWT__ISSUER:-FiapCloudGames}
      Jwt__Audience: ${JWT__AUDIENCE:-FiapCloudGames}
      Kafka__BootstrapServers: kafka:9092
      Kafka__UserCreatedTopic: fcg.users.created
    ports:
      - "${USERS_API_HOST_PORT:-8080}:8080"

  catalog-api:
    build:
      context: ../fiap-cloud-games-catalog-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=fcg_catalog;Username=${POSTGRES_USER:-fcg};Password=${POSTGRES_PASSWORD:-fcg}"
      # Same shared secret/issuer/audience as users-api -> validates its tokens.
      Jwt__SecretKey: ${JWT__SECRETKEY:-dev-only-change-me-please-min-32-characters-placeholder}
      Jwt__Issuer: ${JWT__ISSUER:-FiapCloudGames}
      Jwt__Audience: ${JWT__AUDIENCE:-FiapCloudGames}
      Kafka__BootstrapServers: kafka:9092
      Kafka__OrderPlacedTopic: fcg.orders.placed
      Kafka__PaymentProcessedTopic: fcg.payments.processed
      Kafka__PaymentsConsumerGroup: catalog-service
      # Redis distributed cache (Phase 3): cache-aside for GET /api/games, /api/games/{id}
      # and the library listings; falls back to PostgreSQL if Redis is unavailable.
      Redis__Enabled: "true"
      Redis__ConnectionString: "redis:6379,abortConnect=false,connectTimeout=1000,syncTimeout=1000"
      Redis__DefaultTtlSeconds: "60"
      Redis__ExposeOutcomeHeader: "true"
    ports:
      - "${CATALOG_API_HOST_PORT:-8082}:8080"

  payments-api:
    build:
      context: ../fiap-cloud-games-payments-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      Kafka__BootstrapServers: kafka:9092
      Kafka__OrderPlacedTopic: fcg.orders.placed
      Kafka__PaymentProcessedTopic: fcg.payments.processed
      Kafka__ConsumerGroup: payments-service
      Payment__RejectAboveAmount: "1000"
      # MongoDB payment history (Phase 3): fcg_payments.payments, one document per order.
      Mongo__ConnectionString: "mongodb://${MONGO_USER:-fcg}:${MONGO_PASSWORD:-fcg}@mongo:27017/?authSource=admin"
      Mongo__DatabaseName: fcg_payments
      Mongo__PaymentsCollectionName: payments
      # Same shared secret/issuer/audience as users-api -> validates its tokens for /api/payments.
      Jwt__SecretKey: ${JWT__SECRETKEY:-dev-only-change-me-please-min-32-characters-placeholder}
      Jwt__Issuer: ${JWT__ISSUER:-FiapCloudGames}
      Jwt__Audience: ${JWT__AUDIENCE:-FiapCloudGames}
    ports:
      - "${PAYMENTS_API_HOST_PORT:-8083}:8080"

  # ------------------------------------------------------------------
  # Notifications Function (Phase 3): Kafka-triggered Azure
  # Function (isolated worker) running on the official Functions base image.
  # Main Phase 3 notification path; consumer group notifications-function on
  # fcg.users.created and fcg.payments.processed. No HTTP API, no ports; its
  # logs (stdout) go to Loki through Alloy. `func start` on the host is the
  # development alternative - never run both against the same Kafka.
  # ------------------------------------------------------------------
  notifications-function:
    build:
      context: ../fiap-cloud-games-notifications-function
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      # Not used by the Kafka trigger; local placeholder required by the Functions host settings.
      AzureWebJobsStorage: "UseDevelopmentStorage=true"
      Kafka__BootstrapServers: kafka:9092
      Kafka__UserCreatedTopic: fcg.users.created
      Kafka__PaymentProcessedTopic: fcg.payments.processed
      Kafka__ConsumerGroup: notifications-function

  # Phase 2 NotificationsAPI, kept as history. NOT started by default (profile
  # phase2-legacy) so there is a single notification consumer; enable it only with
  # `docker compose --profile phase2-legacy up -d` and notifications-function stopped.
  notifications-api:
    profiles: ["phase2-legacy"]
    build:
      context: ../fiap-cloud-games-notifications-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      Kafka__BootstrapServers: kafka:9092
      Kafka__UserCreatedTopic: fcg.users.created
      Kafka__PaymentProcessedTopic: fcg.payments.processed
      Kafka__ConsumerGroup: notifications-service
    ports:
      - "${NOTIFICATIONS_API_HOST_PORT:-8081}:8080"

  # ------------------------------------------------------------------
  # Kong API Gateway (Phase 3). DB-less: routes, JWT credential and
  # plugins come from ./gateway/kong.yml. Official external entry point:
  #   proxy   http://localhost:8000   -> users-api / catalog-api / payments-api
  #   admin   http://127.0.0.1:8001   (read-only in DB-less; local inspection)
  #   status  http://127.0.0.1:8100   (/metrics scraped by Prometheus)
  # (host ports above are the defaults; see KONG_*_PORT in .env.example)
  # Direct service ports (8080/8082/8083) stay published for Swagger and dev.
  # ------------------------------------------------------------------
  kong:
    image: kong:3.9
    restart: unless-stopped
    depends_on:
      - users-api
      - catalog-api
      - payments-api
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: notice
      # NOTE: the JWT credential secret lives in gateway/kong.yml (same local/dev
      # placeholder as JWT__SECRETKEY). Kong OSS does not resolve vault references
      # in jwt_secrets, so changing JWT__SECRETKEY requires updating kong.yml too.
    volumes:
      - ./gateway/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "127.0.0.1:${KONG_ADMIN_PORT:-8001}:8001"
      - "127.0.0.1:${KONG_STATUS_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ------------------------------------------------------------------
  # Observability (Phase 3). Prometheus scrapes the three .NET
  # APIs (/metrics via prometheus-net) and the Kong Status API (prometheus plugin);
  # Alloy tails every container of this project through the Docker socket and
  # ships the logs to Loki; Grafana is provisioned automatically with both
  # datasources and the "FCG Overview" / "FCG Logs" dashboards (./observability).
  # Local/dev credentials only; no persistence for metrics or logs.
  # ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    depends_on:
      - users-api
      - catalog-api
      - payments-api
      - kong
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Loki: single-binary log store, filesystem storage, no auth, no volume (demo).
  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  # Alloy: discovers the containers of this compose project through the Docker socket
  # (read-only) and tails their stdout/stderr into Loki. Labels: compose_service, job,
  # container_name, image, platform. UI on localhost only.
  alloy:
    image: grafana/alloy:v1.11.0
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:${ALLOY_HOST_PORT:-12345}:12345"
    depends_on:
      loki:
        condition: service_healthy
    # No container healthcheck: the alloy image ships neither wget nor curl. Readiness is
    # visible on http://127.0.0.1:12345/-/ready and in the Alloy UI component graph.

volumes:
  pg_data:
  mongo_data:
