# ------------------------------------------------------------------
# FIAP Cloud Games - Prometheus on AKS
# Pod discovery in the fcg namespace instead of static targets, so every replica is scraped
# during rolling updates. Opt-in per pod with the annotations
#   prometheus.io/scrape: "true", prometheus.io/port, prometheus.io/path
# The `job` label is the pod's `app` label (users-api, catalog-api, payments-api, kong), the
# same job names as the Compose configuration, so the Grafana dashboards work unchanged.
# Read-only access is granted by a namespaced Role (k8s/azure/30-prometheus.yaml).
# ------------------------------------------------------------------
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fcg-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [fcg]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_phase]
        action: keep
        regex: Running
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: job
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_version]
        target_label: version

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
