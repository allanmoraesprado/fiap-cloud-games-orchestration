# PostgreSQL: single instance, two logical databases (fcg_users, fcg_catalog).
# Ephemeral storage (emptyDir) for this local MVP — databases are recreated and
# the services re-migrate/re-seed on pod restart. A PVC is a future improvement.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: fcg
data:
  01-create-databases.sql: |
    CREATE DATABASE fcg_users;
    CREATE DATABASE fcg_catalog;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fcg
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "fcg"
            - name: POSTGRES_DB
              value: "fcg"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fcg-secret
                  key: Postgres__Password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fcg"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fcg
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
