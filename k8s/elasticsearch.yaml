# Elasticsearch 9 (Phase 4): search engine for the CatalogAPI game search on LOCAL
# Kubernetes. Development only: single node, security disabled, 512 MB heap, ephemeral
# storage - the index is a derived copy that CatalogAPI rebuilds from PostgreSQL.
# The cloud environment uses a managed Elastic Cloud cluster instead (HTTPS + API key).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: fcg
  labels:
    app: elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=2s
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: fcg
spec:
  type: ClusterIP
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      targetPort: 9200
