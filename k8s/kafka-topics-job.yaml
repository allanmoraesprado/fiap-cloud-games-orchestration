# One-shot Job: waits for Kafka, then creates the three FCG topics idempotently.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: fcg
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: kafka-topics
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:3.9.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Waiting for Kafka..."
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
                sleep 3
              done
              echo "Creating FCG topics..."
              for t in fcg.users.created fcg.orders.placed fcg.payments.processed; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
                  --create --if-not-exists --topic "$t" --partitions 1 --replication-factor 1
              done
              echo "Current topics:"
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
