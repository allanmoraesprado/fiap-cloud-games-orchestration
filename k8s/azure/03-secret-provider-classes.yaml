# Secrets Store CSI driver (AKS add-on) + Azure Key Vault provider, authenticated with each
# workload's federated identity. Secrets are mounted as files under /mnt/secrets-store and
# are never stored as Kubernetes Secret objects. objectAlias = file name: for the .NET APIs it
# is the configuration key ("__" separates sections), for the other images the file is read
# through *_FILE variables or by the container command.
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: users-api-secrets
  namespace: fcg
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "${USERS_API_CLIENT_ID}"
    keyvaultName: "${KEYVAULT_NAME}"
    tenantId: "${AZURE_TENANT_ID}"
    objects: |
      array:
        - |
          objectName: jwt-signing-key
          objectType: secret
          objectAlias: Jwt__SecretKey
        - |
          objectName: users-api-postgres-connection
          objectType: secret
          objectAlias: ConnectionStrings__Postgres
        - |
          objectName: users-admin-seed-password
          objectType: secret
          objectAlias: Seed__AdminPassword
---
