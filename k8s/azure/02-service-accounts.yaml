# One ServiceAccount per workload, federated (Workload Identity) with the user-assigned
# managed identity created by Terraform (infra/terraform/identities.tf). The identity may read
# only the Key Vault secrets of that workload. ${..._CLIENT_ID} values are rendered from
# `terraform output workload_identity_client_ids` by scripts/azure/render.sh.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: users-api
  namespace: fcg
  annotations:
    azure.workload.identity/client-id: "${USERS_API_CLIENT_ID}"
    azure.workload.identity/tenant-id: "${AZURE_TENANT_ID}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-api
  namespace: fcg
  annotations:
    azure.workload.identity/client-id: "${CATALOG_API_CLIENT_ID}"
    azure.workload.identity/tenant-id: "${AZURE_TENANT_ID}"
---
