# Grafana Alloy on AKS: collects the logs of the fcg pods through the Kubernetes API
# (observability/alloy/config-aks.alloy -> ConfigMap alloy-config) and pushes them to Loki.
# A single replica is enough (API-based tailing, no node-local files); RBAC is read-only and
# limited to the fcg namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: fcg
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-logs
  namespace: fcg
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-logs
  namespace: fcg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: fcg
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: fcg
  labels:
    app: alloy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.11.0
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
          ports:
            - containerPort: 12345
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy/data
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
