# MongoDB 7 on AKS: payment history of PaymentsAPI (fcg_payments.payments). StatefulSet with an
# Azure Disk PVC; root password read from the Key Vault-mounted file
# (MONGO_INITDB_ROOT_PASSWORD_FILE). PaymentsAPI gets its connection string from Key Vault.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: fcg
  labels:
    app: mongo
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: mongo
      securityContext:
        fsGroup: 999
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "fcg"
            - name: MONGO_INITDB_ROOT_PASSWORD_FILE
              value: "/mnt/secrets-store/mongo-root-password"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: mongo-secrets
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi
        resources:
          requests:
            storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: fcg
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
