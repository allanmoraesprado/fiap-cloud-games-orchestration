apiVersion: v1
kind: Secret
metadata:
  name: fcg-secret
  namespace: fcg
type: Opaque
# LOCAL / DEVELOPMENT PLACEHOLDER VALUES ONLY. Never put real secrets here.
# In production these would come from a secret manager (e.g. Azure Key Vault) —
# documented as a future improvement, NOT integrated in this MVP.
# Single shared Secret so UsersAPI (issuer), CatalogAPI and PaymentsAPI (validators)
# never drift. The same JWT placeholder is embedded in gateway/kong.yml (Kong OSS
# cannot read it from a vault), so both must stay identical.
stringData:
  Jwt__SecretKey: "dev-only-change-me-please-min-32-characters-placeholder"
  Postgres__Password: "fcg"
  Mongo__Password: "fcg"
  Grafana__AdminPassword: "admin"
