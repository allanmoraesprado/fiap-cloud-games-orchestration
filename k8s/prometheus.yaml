# Prometheus (Phase 3). The scrape configuration is NOT duplicated here:
# apply-all creates the ConfigMap `prometheus-config` from
# ../observability/prometheus/prometheus.yml (shared with Docker Compose). Its static
# targets (users-api:8080, catalog-api:8080, payments-api:8080, kong:8100) resolve to
# the Kubernetes Services of the same names. Ephemeral storage, 2-day retention,
# no Alertmanager, no service discovery. NodePort 30090 for local access.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: fcg
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: fcg
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
