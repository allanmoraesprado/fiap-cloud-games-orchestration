# Grafana 12 (Phase 3 / P3-M7), provisioned from files. apply-all creates three
# ConfigMaps from ../observability/grafana (shared with Docker Compose):
#   grafana-datasources        -> /etc/grafana/provisioning/datasources  (Prometheus only)
#   grafana-dashboard-provider -> /etc/grafana/provisioning/dashboards   (file provider)
#   grafana-dashboards         -> /var/lib/grafana/dashboards            (FCG Overview)
# The Loki datasource and the FCG Logs dashboard stay Compose-only: centralized log
# collection on Kubernetes (Alloy DaemonSet + Loki) is documented as a future improvement.
# Admin credentials are LOCAL/DEV PLACEHOLDERS (user admin, password from fcg-secret).
# NodePort 30300 for local access.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: fcg
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fcg-secret
                  key: Grafana__AdminPassword
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: fcg
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
